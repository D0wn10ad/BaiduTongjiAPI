name: Upload Python Package

# DISABLED: this workflow is never executed automatically.
# It uses `workflow_dispatch` (manual-only) so it will NOT run on push,
# release, or any other event. It can only be started by explicitly
# clicking "Run workflow" in the Actions tab.
# Publishing to PyPI requires a valid PYPI_API_TOKEN secret (this repo
# intentionally does not use one).
on:
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build
        pip install -r requirements.txt
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m build
        twine upload dist/*